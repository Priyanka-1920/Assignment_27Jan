apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongo
  namespace: {{ .Values.namespace }}

spec:
  serviceName: mongo-headless

  replicas: 1

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
      - name: mongo

        image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"

        ports:
        - containerPort: 27017

        volumeMounts:
        - name: mongo-pvc
          mountPath: /data/db

  volumeClaimTemplates:
  - metadata:
      name: mongo-pvc

    spec:
      accessModes:
        - ReadWriteOnce

      resources:
        requests:
          storage: {{ .Values.mongo.persistence.size }}
