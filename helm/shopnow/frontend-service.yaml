apiVersion: v1
kind: Service

metadata:
  name: frontend-nodeport
  namespace: {{ .Values.namespace }}

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app: frontend

  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: 80
    nodePort: {{ .Values.frontend.service.nodePort }}
