namespace: shopnow-demo

frontend:
  replicaCount: 1
  image:
    repository: priyankarevri/shopnow-frontend
    tag: v3
    pullPolicy: Always

  service:
    type: NodePort
    port: 80
    nodePort: 30080

backend:
  replicaCount: 1

  image:
    repository: priyankarevri/shopnow-backend
    tag: v1
    pullPolicy: Always

  service:
    type: NodePort
    port: 5000
    nodePort: 31590

  env:
    MONGODB_URI: mongodb://mongo-headless:27017/shopnow

mongo:
  image:
    repository: mongo
    tag: "6.0"

  service:
    port: 27017

  persistence:
    size: 5Gi
